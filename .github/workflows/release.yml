# Builds the x64 and ARM64 installers and publishes them as a GitHub release when a version tag is pushed:
#
#   git tag v1.2.0
#   git push origin v1.2.0
#
# Running the workflow by hand (Actions > Release > Run workflow) builds the installers as a
# workflow artifact without creating a release, to check the build before tagging.
#
# The app's in-app updater reads the latest release, so the asset names here must match
# UpdateService.InstallerSuffix (NFDFix-<version>-win-<arch>-setup.exe).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the test build (no release is created)"
        required: true
        default: "0.0.1"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Read version
        id: parse
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            value="$GITHUB_REF_NAME"
          else
            value="v$INPUT_VERSION"
          fi
          # The updater and the installer both need a plain major.minor.patch version.
          if [[ ! "$value" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::'$value' must look like v1.2.3"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - arch: x64
            platform: x64
            runner: windows-latest
          # Native AOT builds on a native ARM64 runner instead of cross-compiling.
          - arch: arm64
            platform: ARM64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - name: Test
        run: dotnet test NFDFix.Tests -c Release -p:Platform=${{ matrix.platform }}

      - name: Publish
        run: >
          dotnet publish NFDFix -c Release
          -p:Platform=${{ matrix.platform }}
          -p:Version=${{ needs.version.outputs.version }}
          -o publish/${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: publish-${{ matrix.arch }}
          path: publish/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  installer:
    needs: [version, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: publish-*
          path: publish

      - name: Find Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build installers
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          foreach ($arch in "x64", "arm64") {
            & $env:ISCC "/DAppVersion=$version" "/DArch=$arch" "/DSourceDir=$PWD\publish\publish-$arch" "/O$PWD\dist" installer\NFDFix.iss
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed for $arch" }
          }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: installer
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.exe
          --repo "$GITHUB_REPOSITORY"
          --title "NFDFix ${GITHUB_REF_NAME#v}"
          --generate-notes
          --verify-tag
